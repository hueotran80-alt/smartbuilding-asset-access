
[functions.face-recognition]
enabled = true
verify_jwt = true
entrypoint = "./functions/face-recognition/index.ts"

[functions.webauthn-register-options]
enabled = true
verify_jwt = false
import_map = "./functions/webauthn-register-options/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/webauthn-register-options/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/webauthn-register-options/*.html" ]

